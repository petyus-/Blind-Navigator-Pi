# Blind Navigator config — kover side
SERVER=100.119.157.3      # kover Tailscale IP (tailscale ip -4, verified 2026-11-09)
PORT=5014                 # blindbox-server /ask (multipart question/photo/lang -> mp3)
PI5_IP=100.82.117.12      # Pi5 Tailscale IP for deploy-watch.sh
PI_USER=pi
DETECT_FPS=1              # v2 CPU object detection frames/sec (Pi5 CPU: keep 1)
CONF=0.45                 # YOLO confidence threshold
IMGZ=320                  # YOLO input size (320 = fast on CPU)

# v2.5 debug logging — day folders on Pi5 under /var/lib/blindnav/log/YYYY-MM-DD/
# (frames .jpg, voice input .wav, answers .mp3, events.log), auto-uploaded to
# kover /home/administrator/blindnav-logs/ every 15 min; 7 days kept on the Pi.
LOG=1
LOG_DIR=/var/lib/blindnav/log

# v2.5 voice commands (USB mic). 0 disables. REC_SECONDS = mic capture length.
VOICE=1
REC_SECONDS=4
STT_URL=http://100.119.157.3:8012/v1/audio/transcriptions   # whisper on kover
STT_LANG=hu

# v2.6 always-listen voice mode (blindnav-listen.service, no button needed).
# Mic access: the arecord inside listen.py is the ONLY recorder (exclusive).
ALWAYS_LISTEN=1            # v2.6 always-listen VAD (blindnav-listen.service)
VAD_THRESHOLD_MULT=3.0     # speech if RMS >= noise floor * this (tune 2.5-5)
VAD_THRESHOLD=0.03         # secondary relative rule: RMS >= floor*(1+0.03)
MAX_UTT=12                 # hard cap on one utterance (seconds)
